<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>E-commerce Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .navbar {
            background: #222;
            color: white;
            padding: 18px 30px;
            font-size: 22px;
        }

        .container {
            padding: 30px;
        }

        .cards {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 8px;
            flex: 1;
            box-shadow: 0 2px 8px #ddd;
        }

        .card h3 {
            color: #666;
            margin-bottom: 10px;
        }

        .card p {
            font-size: 28px;
            font-weight: bold;
        }

        .products {
            background: white;
            padding: 25px;
            border-radius: 8px;
        }

        .products h2 {
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f1f1f1;
        }

        .status {
            color: green;
            font-weight: bold;
        }

        button {
            background: #222;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <div class="navbar">
        E-commerce Admin Dashboard
    </div>

    <div class="container">

        <!-- Dashboard Cards -->
        <div class="cards">

            <div class="card">
                <h3>Total Orders</h3>
                <p>1,250</p>
            </div>

            <div class="card">
                <h3>Total Products</h3>
                <p>350</p>
            </div>

            <div class="card">
                <h3>Total Customers</h3>
                <p>820</p>
            </div>

            <div class="card">
                <h3>Total Revenue</h3>
                <p>₹2.5L</p>
            </div>

        </div>

        <!-- Products Table -->
        <div class="products">

            <h2>Recent Orders</h2>

            <table>

                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Customer</th>
                        <th>Product</th>
                        <th>Amount</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody>

                    <tr>
                        <td>#1001</td>
                        <td>Rahul</td>
                        <td>Laptop</td>
                        <td>₹55,000</td>
                        <td class="status">Delivered</td>
                        <td>
                            <button>View</button>
                        </td>
                    </tr>

                    <tr>
                        <td>#1002</td>
                        <td>Priya</td>
                        <td>Mobile</td>
                        <td>₹25,000</td>
                        <td class="status">Delivered</td>
                        <td>
                            <button>View</button>
                        </td>
                    </tr>

                    <tr>
                        <td>#1003</td>
                        <td>Arun</td>
                        <td>Headphones</td>
                        <td>₹3,500</td>
                        <td>Pending</td>
                        <td>
                            <button>View</button>
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</body>
</html>
